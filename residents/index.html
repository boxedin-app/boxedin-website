<title>Make your block a Quiet Block | BoxedIn</title>
<meta name="description" content="A 30-second look at BoxedIn: scan the sticker, the owner gets a private alert, they move. No honking. Join the waitlist.">

<meta property="og:description" content="A 30-second look at BoxedIn. Scan. Don't Honk.">

<style>
/* Layout: a 9:16 story player, one scene at a time, auto-advancing like a 30-second spot, ending on the waitlist button. Single brand look by design (BoxedIn ink, cream, orange). */
:root {
  --ink: #14161A;
  --ink-2: #22252B;
  --cream: #F7F4EF;
  --paper: #F2EEE8;
  --card: #FBF9F6;
  --line: #E2DCD2;
  --orange: #FF6A13;
  --orange-text: #B4430C;
  --muted-dark: #C9C4BC;
  --muted-light: #4A4F57;
  --display: 'Oswald', 'Arial Narrow', Arial, sans-serif;
  --body: 'Public Sans', 'Helvetica Neue', Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--paper);
  font-family: var(--body);
  display: flex;
  justify-content: center;
  align-items: stretch;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.player {
  position: relative;
  width: 100%;
  max-width: 460px;
  height: 100%;
  max-height: 940px;
  align-self: center;
  overflow: hidden;
  background: var(--ink);
}
@media (min-width: 520px) {
  .player { border-radius: 28px; box-shadow: 0 0 0 1px var(--ink-2); height: calc(100% - 32px); }
}

/* Top bar: progress, logo, controls */
.top {
  position: absolute; inset: 0 0 auto 0; z-index: 5;
  padding-top: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: 12px;
  display: flex; flex-direction: column; gap: 12px;
  background: var(--ink); color: var(--paper);
  pointer-events: none;
}
.barsrow { display: flex; align-items: center; gap: 10px; min-height: 22px; }
.bars { display: flex; gap: 4px; flex: 1; }
[hidden] { display: none !important; }
.bar { flex: 1; height: 4px; border-radius: 2px; background: rgba(150,150,150,.35); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--orange); }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { display: flex; align-items: center; min-width: 0; }
.logo img { display: block; width: min(220px, calc(100vw - 32px - 184px)); min-width: 140px; height: auto; }
.controls { display: flex; gap: 6px; pointer-events: auto; flex: none; }
/* Language pill: same oval as the app and boxedinnyc.com (92 x 34 track, 44 x 30 pill, 44 x 44 taps) */
.lang-pill{display:flex;align-items:center;width:92px;height:44px;position:relative;flex:none;pointer-events:auto;margin:-11px -2px -11px 0}
.lang-pill::before{content:"";position:absolute;left:0;right:0;top:5px;height:34px;border-radius:17px;background:#2A2D34}
.lang-pill button{position:relative;width:44px;height:44px;padding:0;margin:0;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font:500 13px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#B5AFA5}
.lang-pill button span{display:flex;align-items:center;justify-content:center;width:44px;height:30px;border-radius:15px}
.lang-pill button[aria-pressed="true"]{color:#F7F4EF;font-weight:700}
.lang-pill button[aria-pressed="true"] span{background:#1F2228;box-shadow:0 0 0 1px #343740}
.lang-pill button:focus-visible{outline:2px solid var(--orange);outline-offset:-2px;border-radius:15px}
.pause {
  font: 600 13px/1 var(--body); border: 0; cursor: pointer; color: inherit; background: transparent;
  min-width: 38px; min-height: 38px; border-radius: 999px;
}
.pause { background: rgba(120,120,120,.25); display: grid; place-items: center; }
.pause svg { width: 14px; height: 14px; fill: currentColor; }
.controls { align-items: center; }
.count { font: 600 13px/1 var(--body); font-variant-numeric: tabular-nums; opacity: .75; min-width: 26px; text-align: right; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

/* The top bar is one solid dark band on every scene, like the app */

/* Tap zones */
.tap { position: absolute; top: 104px; bottom: 0; z-index: 3; width: 34%; border: 0; background: transparent; cursor: pointer; padding: 0; }
.tap.prev { left: 0; } .tap.next { right: 0; width: 66%; }
.player.final .tap { display: none; }

/* Scenes */
.scene {
  position: absolute; inset: 0;
  padding-top: 116px; padding-bottom: 32px;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; justify-content: center; gap: 22px;
}
.scene.dark { background: var(--ink); color: var(--paper); }
.scene.light { background: var(--cream); color: var(--ink); }
.scene.orange { background: var(--orange); color: var(--ink); }
.kicker { font: 700 13px/1.3 var(--body); letter-spacing: 2.5px; text-transform: uppercase; color: var(--orange); margin: 0; }
.light .kicker { color: var(--orange-text); }
.orange .kicker { color: var(--ink); }
h1, h2 { font-family: var(--display); font-weight: 700; text-transform: uppercase; line-height: 1.04; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(46px, 13vw, 62px); }
h2 { font-size: clamp(36px, 10vw, 46px); }
/* Long words (COMMUNICATION) sized so the line sits inside both side margins */
h1.fit { font-size: clamp(32px, 10vw, 47px); }
.accent { color: var(--orange); }
.orange .accent { color: var(--paper); }
p.lede { font-size: 19px; line-height: 1.5; margin: 0; max-width: 34ch; }
.dark p.lede { color: var(--muted-dark); }
.light p.lede { color: var(--muted-light); }
.orange p.lede { color: var(--ink); }
.fine { font-size: 13px; line-height: 1.45; margin: 0; opacity: .8; }

/* Scene 1: the horn */
.clock { font: 600 22px/1 var(--display); letter-spacing: 2px; color: var(--muted-dark); margin: 0; }
.honk { font: 700 clamp(82px, 24vw, 112px)/.9 var(--display); color: var(--orange); margin: 0; letter-spacing: -1px; display: inline-block; }
.on .honk { animation: shake .32s ease-in-out 10; }
.player:not(.started) .honk { animation: none !important; }
/* Tap-to-play card: phones only allow sound after a tap */
.start { position: absolute; inset: 0; z-index: 6; border: 0; cursor: pointer; width: 100%;
  background: rgba(20,22,26,.86); color: var(--paper);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-family: var(--body); }
.start .play { width: 92px; height: 92px; border-radius: 50%; background: var(--orange); display: grid; place-items: center; }
.start .play svg { width: 36px; height: 36px; fill: var(--ink); margin-left: 6px; }
.start b { font: 700 26px/1.1 var(--display); text-transform: uppercase; letter-spacing: 1px; }
.start span { font-size: 15px; color: var(--muted-dark); }
.player.started .start { display: none; }
.waves { display: flex; gap: 8px; }
.waves span { height: 6px; border-radius: 3px; background: var(--orange); opacity: .35; }
.waves span:nth-child(1){ width: 30%; } .waves span:nth-child(2){ width: 50%; } .waves span:nth-child(3){ width: 18%; }

/* List rows (sound, trust) */
.rows { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: 16px; }
.light .row { background: var(--card); border: 1px solid var(--line); }
.dark .row { background: var(--ink-2); }
.row .ico { flex: none; width: 28px; height: 28px; color: var(--orange); }
.row h3 { font: 600 21px/1.15 var(--display); text-transform: uppercase; margin: 0 0 4px; }
.row p { margin: 0; font-size: 16px; line-height: 1.45; }
.light .row p { color: var(--muted-light); }
.dark .row p { color: var(--muted-dark); }

/* How it works */
.steps { display: flex; flex-direction: column; gap: 12px; }
.step { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.step.last { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.step .n { font: 700 46px/1 var(--display); color: var(--orange); }
.step h3 { font: 600 21px/1.15 var(--display); text-transform: uppercase; margin: 0 0 3px; }
.step p { margin: 0; font-size: 15px; line-height: 1.4; color: var(--muted-light); }
.step.last p { color: var(--muted-dark); }

/* Price */
.price { background: var(--ink); color: var(--paper); border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 8px; }
.price .tag { font: 700 12px/1 var(--body); letter-spacing: 2.5px; text-transform: uppercase; color: var(--orange); margin: 0; }
.price .big { font: 700 64px/1 var(--display); margin: 0; white-space: nowrap; }
.price .big span { color: var(--orange); font-size: 30px; }
.price p { margin: 0; font-size: 15px; line-height: 1.45; color: var(--muted-dark); }
.checks { display: flex; flex-direction: column; gap: 10px; }
.checks p { margin: 0; display: flex; gap: 10px; font-size: 16px; line-height: 1.4; color: var(--ink); }
.checks svg { flex: none; width: 22px; height: 22px; color: var(--orange-text); margin-top: 1px; }

/* Quiet Block goal */
.goal { background: var(--ink); color: var(--paper); border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
.cars { display: flex; gap: 8px; }
.cars span { flex: 1; height: 54px; border-radius: 10px; background: var(--ink-2); display: grid; place-items: center; }
.cars span svg { width: 78%; height: auto; }
.cars span.on { background: var(--orange); }
.goal .big { font: 700 40px/1 var(--display); margin: 0; text-transform: uppercase; }
/* The car drives across: each box lights orange in turn, left to right, on a loop */
.cars.chase span { color: #3A3E46; overflow: hidden; animation: lane 1.6s linear infinite; animation-delay: calc(var(--i) * .2s + .5s); }
.cars.chase span svg { animation: drive 1.6s linear infinite; animation-delay: calc(var(--i) * .2s + .5s); }
@keyframes lane {
  0% { background-color: var(--ink-2); color: #3A3E46; }
  10%, 26% { background-color: var(--orange); color: var(--ink); }
  40%, 100% { background-color: var(--ink-2); color: #3A3E46; }
}
@keyframes drive {
  0% { transform: translateX(-35%); }
  14%, 100% { transform: translateX(0); }
}
/* New look (approved 11-07-2026): liquid glass car facing right; windows and wheel centers glow orange while its box is lit */
.cars span { background-image: linear-gradient(180deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 60%); }
.cars.chase span svg .w { animation: win 1.6s linear infinite; animation-delay: calc(var(--i) * .2s + .5s); }
@keyframes win {
  0% { fill: #4A4F57; }
  10%, 26% { fill: #FFB067; }
  40%, 100% { fill: #4A4F57; }
}
.goal p { margin: 0; font-size: 14px; line-height: 1.45; color: var(--muted-dark); }

/* Final card */
.final-logo img { display: block; width: 100%; max-width: 360px; height: auto; }
.cta {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 60px; border-radius: 14px; background: var(--orange); color: var(--ink);
  font: 700 22px/1 var(--display); text-transform: uppercase; letter-spacing: 1px; text-decoration: none;
}
.cta svg { width: 22px; height: 22px; }
.meta { display: flex; flex-direction: column; gap: 6px; }
.meta p { margin: 0; font-size: 15px; line-height: 1.45; color: var(--muted-dark); }
.again { align-self: flex-start; display: flex; align-items: center; gap: 8px; border: 1px solid #3A3E46; background: transparent; color: var(--paper); border-radius: 999px; min-height: 44px; padding: 0 18px; font: 600 14px/1 var(--body); cursor: pointer; }
.again svg { width: 16px; height: 16px; fill: currentColor; }

/* Entrance motion: content is visible at rest; only the active scene animates in */
.scene > * { transition: none; }
.on > * { animation: rise .55s cubic-bezier(.2,.7,.2,1) both; }
.on > *:nth-child(2) { animation-delay: .25s; }
.on > *:nth-child(3) { animation-delay: .6s; }
.on > *:nth-child(4) { animation-delay: 1s; }
.on > *:nth-child(5) { animation-delay: 1.4s; }
.on .steps > *, .on .rows > * { animation: rise .5s cubic-bezier(.2,.7,.2,1) both; }
.on .steps > *:nth-child(1), .on .rows > *:nth-child(1) { animation-delay: .5s; }
.on .steps > *:nth-child(2), .on .rows > *:nth-child(2) { animation-delay: 1.6s; }
.on .steps > *:nth-child(3), .on .rows > *:nth-child(3) { animation-delay: 2.7s; }
.on .rows > *:nth-child(4) { animation-delay: 3.4s; }
.on .cars span.on { animation: pop .4s ease-out 1.2s both; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { transform: scale(.6); opacity: .3; } to { transform: none; opacity: 1; } }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-6px) rotate(-2deg); } 75% { transform: translateX(6px) rotate(2deg); } }
@media (prefers-reduced-motion: reduce) {
  .on > *, .on .steps > *, .on .rows > *, .on .cars span.on, .on .honk, .cars.chase span, .cars.chase span svg, .cars.chase span svg .w { animation: none !important; }
  .cars.chase span:first-child { background-color: var(--orange); color: var(--ink); }
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>

  function kick(t, out, big) {
    var g = env(t, big ? 0.45 : 0.28, big ? 0.9 : 0.55, out, 0.003);
    var o = ctx.createOscillator(); o.frequency.setValueAtTime(big ? 140 : 150, t); o.frequency.exponentialRampToValueAtTime(big ? 42 : 50, t + (big ? 0.3 : 0.15));
    o.connect(g); o.start(t); o.stop(t + 0.5); musicLive.push(o);
  }
  function snare(t, out) { noise(t, 0.15, 1800, 'bandpass', 0.22, out); var g = env(t, 0.08, 0.08, out, 0.002); osc(t, 0.08, 190, 'triangle', g); }
  function startMusic() {
    if (muted || !audio()) return;
    if (musicGain && ctx.currentTime < musicEnd - 0.5) return; // already playing
    if (!musicBuf) { loadMusic().then(function () { if (started && idx >= 1 && idx <= SCENES.length - 2) startMusic(); }); return; }
    stopMusic(true);
    var t0 = ctx.currentTime + 0.03;
    musicT0 = t0;
    musicGain = ctx.createGain(); musicGain.connect(master);
    musicGain.gain.setValueAtTime(0.0001, t0);
    musicGain.gain.linearRampToValueAtTime(0.9, t0 + 0.25);
    var src = ctx.createBufferSource(); src.buffer = musicBuf; src.loop = true;
    src.connect(musicGain); src.start(t0);
    musicLive = [src]; musicEnd = Infinity;
  }
  // Scene 5: the beat drops as each of the four cards lands, on the music's own beat
  function cardDrops(rows) {
    if (muted || !ctx || !musicGain) return false;
    var now = ctx.currentTime, first = now + 0.45;
    var nb = musicT0 + Math.ceil((first - musicT0) / BEAT) * BEAT;
    rows.forEach(function (row, k) {
      var tHit = nb + k * BEAT;
      kick(tHit, master, true);
      noise(tHit, 0.25, 1200, 'bandpass', 0.45, master);
      musicGain.gain.setValueAtTime(0.9, tHit - 0.01);
      musicGain.gain.linearRampToValueAtTime(0.35, tHit + 0.02);
      musicGain.gain.linearRampToValueAtTime(0.9, tHit + BEAT * 0.8);
      row.style.animationDelay = Math.max(0, tHit - now - 0.12).toFixed(3) + 's';
    });
    return true;
  }
  function stopMusic(now) {
    if (musicGain && ctx) {
      var g = musicGain, t = ctx.currentTime;
      g.gain.cancelScheduledValues(t);
      g.gain.setValueAtTime(Math.max(g.gain.value, 0.0001), t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (now ? 0.05 : 0.12));
      var old = musicLive; setTimeout(function () { old.forEach(function (o) { try { o.stop(); } catch (e) {} }); }, 200);
    }
    musicLive = []; musicGain = null; musicEnd = 0;
  }
  // Final screen: the music keeps playing very softly under Wanda's voice, then fades away
  function duckMusic() {
    startMusic();
    if (!musicGain || !ctx) return;
    var g = musicGain, t = ctx.currentTime;
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(Math.max(g.gain.value, 0.0001), t);
    g.gain.linearRampToValueAtTime(0.3, t + 0.15);
    g.gain.setValueAtTime(0.3, t + 4);
    g.gain.linearRampToValueAtTime(0.0001, t + 8);
    musicEnd = t + 8;
    musicLive.forEach(function (o) { try { o.stop(t + 8.2); } catch (e) {} });
  }
  function stopHonks() {
    live.forEach(function (o) { try { o.stop(); } catch (e) {} });
    live = [];
  }
  document.getElementById('btn-start').addEventListener('click', function () {
    started = true; player.classList.add('started');
    audio(); loadVoice(lang); loadMusic(); go(0);
  });
  var soundBtn = document.getElementById('btn-sound');
  soundBtn.addEventListener('click', function () {
    muted = !muted;
    soundBtn.setAttribute('aria-pressed', muted);
    soundBtn.setAttribute('aria-label', muted ? 'Turn sound on' : 'Mute sound');
    document.getElementById('sound-icon').innerHTML = muted
      ? '<path d="M1 5h2.5L7 2v10L3.5 9H1z"/><path d="M9 5l4 4M13 5l-4 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>'
      : '<path d="M1 5h2.5L7 2v10L3.5 9H1z"/><path d="M9 4.5a3.5 3.5 0 0 1 0 5M10.8 2.8a6 6 0 0 1 0 8.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>';
    if (muted) { stopHonks(); stopMusic(true); } else if (started && idx >= 1 && idx <= SCENES.length - 2) startMusic();
  });

  function setPaused(p) {
    paused = p;
    pauseBtn.setAttribute('aria-label', p ? (lang === 'es' ? 'Reproducir' : 'Play') : (lang === 'es' ? 'Pausa' : 'Pause'));
    pauseIcon.innerHTML = p ? '<path d="M3 1.5v11l9.5-5.5z"/>' : '<rect x="2" y="1" width="3.5" height="12" rx="1"/><rect x="8.5" y="1" width="3.5" height="12" rx="1"/>';
    player.querySelectorAll('.on, .on *').forEach(function (el) { el.style.animationPlayState = p ? 'paused' : ''; });
    if (ctx) { if (p) ctx.suspend(); else ctx.resume(); }
  }

  function tick(t) {
    if (last === null) last = t;
    var dt = t - last; last = t;
    var s = SCENES[idx];
    if (started && !paused && !s.final && !document.hidden) {
      elapsed += dt;
      if (elapsed >= s.ms) go(idx + 1); else paintBars();
    }
    requestAnimationFrame(tick);
  }

  document.getElementById('tap-next').addEventListener('click', function () { go(idx + 1); });
  document.getElementById('tap-prev').addEventListener('click', function () { go(elapsed < 800 ? idx - 1 : idx); });
  pauseBtn.addEventListener('click', function () { setPaused(!paused); });
  document.getElementById('btn-back').addEventListener('click', function () { go(idx - 1); setPaused(paused); });
  document.getElementById('btn-fwd').addEventListener('click', function () { go(idx + 1); setPaused(paused); });
  ['btn-en', 'btn-es'].forEach(function (id) {
    document.getElementById(id).addEventListener('click', function (e) {
      lang = e.currentTarget.dataset.lang; try { localStorage.setItem('boxedin-lang', lang); } catch (x) {} render(); setPaused(paused);
    });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') go(idx + 1);
    else if (e.key === 'ArrowLeft') go(idx - 1);
    else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); setPaused(!paused); }
  });

  render();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
