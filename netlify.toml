# BoxedIn on Netlify (11-02-2026). Plain HTML: no build step, published from the repo root.
[build]
  publish = "."

# Every sticker address boxedinnyc.com/s/[code] shows the one scan page; the page reads the code.
[[redirects]]
  from = "/s/*"
  to = "/s/index.html"
  status = 200

# Waitlist (11-03-2026, approved by Wanda): the permanent address printed on flyers and QR codes.
# It forwards to the current sign-up form. If the form ever moves, change only the "to" line;
# every printed QR keeps working. 302 (temporary) on purpose, so browsers never remember the old target.
[[redirects]]
  from = "/waitlist"
  to = "https://mailchi.mp/boxedinnyc/waitlist"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Scan pages: never cached by a browser, never sent as a referrer, never indexed.
[[headers]]
  for = "/s/*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex"

# Unsubscribe page: never cached, never sent as a referrer, never indexed (the link carries a token).
[[headers]]
  for = "/unsubscribe*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex"

# Universal Links (11-04-2026): tells iPhones that BoxedIn (team 8JGAU4NY6D, app com.boxedinnyc.app)
# may open boxedinnyc.com/email-confirmed links. Apple requires this file be served as JSON with no redirect.
# No customer wording. Only the paths listed in the file open the app; every other page stays on the website.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"
