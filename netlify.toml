# BoxedIn on Netlify (11-02-2026). Plain HTML: no build step, published from the repo root.
[build]
  publish = "."

# Every sticker address boxedinnyc.com/s/[code] shows the one scan page; the page reads the code.
[[redirects]]
  from = "/s/*"
  to = "/s/index.html"
  status = 200

# Waitlist (11-03-2026, approved by Wanda): the permanent address printed on flyers and QR codes.
# It forwards to the current sign-up form. If the form ever moves, change only the "to" line;
# every printed QR keeps working. 302 (temporary) on purpose, so browsers never remember the old target.
[[redirects]]
  from = "/waitlist"
  to = "https://mailchi.mp/boxedinnyc/waitlist"
  status = 302
  force = true

# Scan Spot store links (11-08-2026, approved by Wanda): Total Wireless, 4 Bronx stores.
# Each store has its own PERMANENT address, printed on its counter flyer QR code. Never remove or reuse these.
# Before launch they forward to the Total Wireless waitlist page (Mailchimp, auto-tag "Scan Spot: Total Wireless").
# After launch, change only the "to" lines (e.g. to app sign-up carrying the store code). Printed QR codes keep working.
# Store 1 YQA5SP, Store 2 SK6QVH, Store 3 2B7W9Z, Store 4 NXKXWX. Lowercase versions forward too.
[[redirects]]
  from = "/spot/YQA5SP"
  to = "https://mailchi.mp/boxedinnyc/total-wireless"
  status = 302
  force = true

[[redirects]]
  from = "/spot/yqa5sp"
  to = "https://mailchi.mp/boxedinnyc/total-wireless"
  status = 302
  force = true

[[redirects]]
  from = "/spot/SK6QVH"
  to = "https://mailchi.mp/boxedinnyc/total-wireless"
  status = 302
  force = true

[[redirects]]
  from = "/spot/sk6qvh"
  to = "https://mailchi.mp/boxedinnyc/total-wireless"
  status = 302
  force = true

[[redirects]]
  from = "/spot/2B7W9Z"
  to = "https://mailchi.mp/boxedinnyc/total-wireless"
