[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Scan pages: never cached by a browser, never sent as a referrer, never indexed.
# Fonts hosted on our own site (11-13-2026). Cached for a year. If a font file ever changes,
# give it a NEW file name and update style.css and residents/index.html (never replace in place).
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/s/*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex"

# Unsubscribe page: never cached, never sent as a referrer, never indexed (the link carries a token).
[[headers]]
  for = "/unsubscribe*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex"

# Manage my membership (11-06-2026): signed-in page, never cached, never sent as a referrer, never indexed.
[[headers]]
  for = "/manage*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex"

# After Stripe checkout (11-06-2026, wording approved by Wanda): card saved / no card saved. Never cached or indexed.
[[headers]]
  for = "/card-saved*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/checkout-canceled*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex"

# Universal Links (11-04-2026): tells iPhones that BoxedIn (team 8JGAU4NY6D, app com.boxedinnyc.app)
# may open boxedinnyc.com/email-confirmed links. Apple requires this file be served as JSON with no redirect.
# No customer wording. Only the paths listed in the file open the app; every other page stays on the website.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"
