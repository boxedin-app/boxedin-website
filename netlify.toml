# BoxedIn on Netlify (11-02-2026). Plain HTML: no build step, published from the repo root.
[build]
  publish = "."

# Every sticker address boxedinnyc.com/s/[code] shows the one scan page; the page reads the code.
[[redirects]]
  from = "/s/*"
  to = "/s/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Scan pages: never cached by a browser, never sent as a referrer, never indexed.
[[headers]]
  for = "/s/*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex"
